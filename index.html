<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fair Raffle</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <h1 class="h3 mb-2">Fair Raffle</h1>

            <div class="mb-3">
                <label for="userInput" class="form-label">
                    Participants
                </label>
                <input
                        type="text"
                        id="userInput"
                        class="form-control"
                        placeholder="Enter draft participants..."
                >
            </div>

            <button
                    type="button"
                    id="actionButton"
                    class="btn btn-primary"
            >
                Draw!
            </button>

            <div class="mt-4">
                <label for="result" class="form-label">
                    Result
                </label>
                <textarea
                        id="result"
                        class="form-control"
                        rows="4"
                        readonly
                        placeholder="The draft result will appear here..."
                ></textarea>
            </div>

        </div>
    </div>
</div>

<script>
    const input = document.getElementById("userInput");
    const button = document.getElementById("actionButton");
    const result = document.getElementById("result");

    button.addEventListener("click", () => {
        result.value = doDraft(input.value);
        input.disabled = true;
        button.disabled = true;
    });

    function doDraft(candidatesStr) {
        const candidates = candidatesStr.split(/\s+/);
        const draft = shuffle(candidates);
        return draft.join(" ");
    }

    function shuffle(candidates) {
        return candidates;
    }
</script>

</body>
</html>
